name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_MIN: "80"

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - macos-latest

        python-version:
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Configure Git
        run: |
          git config --global user.name "gconflict-ci"
          git config --global user.email "gconflict-ci@users.noreply.github.com"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest -v

  coverage:
    name: Coverage

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Configure Git
        run: |
          git config --global user.name "gconflict-ci"
          git config --global user.email "gconflict-ci@users.noreply.github.com"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run coverage
        run: |
          python -m pytest \
            --cov=gconflict \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under="${COVERAGE_MIN}"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  ci-passed:
    name: CI passed

    if: always()

    needs:
      - tests
      - coverage

    runs-on: ubuntu-latest

    steps:
      - name: Verify CI
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "Test matrix failed."
            exit 1
          fi

          if [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "Coverage check failed."
            exit 1
          fi

          echo "All CI checks passed."