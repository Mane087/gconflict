<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">gconflict logo</title>
  <desc id="desc">Terminal-style Git conflict resolver logo with branching merge graph and pixel-art gconflict wordmark.</desc>

  <!-- Transparent background by design -->

  <g id="terminal-icon" transform="translate(70 100)">
    <!-- terminal frame -->
    <path d="M55 0 H360
             Q415 0 415 55
             V165
             M415 250
             V345
             Q415 400 360 400
             H55
             Q0 400 0 345
             V55
             Q0 0 55 0"
          fill="none" stroke="#16222B" stroke-width="18"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- terminal prompt -->
    <path d="M55 50 L82 72 L55 94"
          fill="none" stroke="#16222B" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="98" y1="92" x2="130" y2="92"
          stroke="#16222B" stroke-width="10" stroke-linecap="round"/>

    <!-- upper branch -->
    <circle cx="72" cy="150" r="18" fill="#F04A2A"/>
    <path d="M90 150 H170 L205 184"
          fill="none" stroke="#F04A2A" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M220 198 L270 222"
          fill="none" stroke="#F04A2A" stroke-width="10"
          stroke-dasharray="8 12" stroke-linecap="round"/>

    <!-- lower branch -->
    <circle cx="72" cy="300" r="18" fill="#495966"/>
    <path d="M90 300 H170 L205 268"
          fill="none" stroke="#495966" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M220 255 L270 232"
          fill="none" stroke="#495966" stroke-width="10"
          stroke-dasharray="8 12" stroke-linecap="round"/>

    <!-- merge node -->
    <circle cx="300" cy="225" r="42" fill="white" stroke="#16222B" stroke-width="12"/>
    <path d="M282 226 L296 240 L321 210"
          fill="none" stroke="#F04A2A" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- resolved branch -->
    <line x1="342" y1="225" x2="395" y2="225"
          stroke="#16222B" stroke-width="12" stroke-linecap="round"/>
    <circle cx="415" cy="225" r="20" fill="#16222B"/>
  </g>

